name: Release

on:
  push:
    tags: ["v*-nixling.*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      GITHUB_TOKEN: ""
      ACTIONS_RUNTIME_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            pkg-config \
            libdrm-dev \
            libepoxy-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libgles2-mesa-dev \
            libva-dev \
            libvulkan-dev
      - name: Build virglrenderer
        run: |
          meson setup build \
            --buildtype=release \
            --prefix=/usr \
            -Dplatforms=egl \
            -Dvenus=true \
            -Dvideo=true \
            -Dtests=false
          meson compile -C build
      - name: Install into staging directory
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DESTDIR="$PWD/release/rootfs" meson install -C build
          tar czf "release/virglrenderer-${VERSION}-x86_64-linux.tar.gz" \
            -C release/rootfs .
          cd release && sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: release/

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: release/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          gh release create "$VERSION" release/*.tar.gz release/SHA256SUMS \
            --title "$VERSION" \
            --notes "Automated release. virglrenderer with nixling VA-API compatibility patch."

      - name: Install Nix (for hash computation)
        uses: DeterminateSystems/nix-installer-action@main
      - name: Compute SRI hashes and commit prebuilt manifest
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          REPO="${{ github.repository }}"

          mkdir -p nix
          {
            echo "{"
            echo "  \"version\": \"$VERSION\","
            echo "  \"system\": \"x86_64-linux\","
            echo "  \"binaries\": {"
            first=true
            for asset in release/*.tar.gz; do
              [ -f "$asset" ] || continue
              base=$(basename "$asset")
              name=$(echo "$base" | sed -E "s/-${VERSION}-x86_64-linux\.tar\.gz$//")
              sri=$(nix hash file --type sha256 --sri "$asset")
              url="https://github.com/${REPO}/releases/download/${VERSION}/${base}"
              if [ "$first" = true ]; then first=false; else printf ',\n'; fi
              printf '    "%s": {\n      "url": "%s",\n      "hash": "%s"\n    }' "$name" "$url" "$sri"
            done
            echo ""
            echo "  }"
            echo "}"
          } > nix/prebuilt.json

      - name: Commit prebuilt manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/prebuilt.json
          git diff --cached --quiet && exit 0
          git commit -m "release: update prebuilt manifest for ${GITHUB_REF_NAME}"
          git push origin HEAD:refs/heads/nixling/main
