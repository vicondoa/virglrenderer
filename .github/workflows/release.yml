name: Release

on:
  push:
    tags: ["v*-nixling.*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      GITHUB_TOKEN: ""
      ACTIONS_RUNTIME_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            pkg-config \
            libdrm-dev \
            libepoxy-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libgles2-mesa-dev \
            libva-dev \
            libvulkan-dev
      - name: Build virglrenderer
        run: |
          meson setup build \
            --buildtype=release \
            --prefix=/usr \
            -Dplatforms=egl \
            -Dvenus=true \
            -Dvideo=true \
            -Dtests=false
          meson compile -C build
      - name: Install into staging directory
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DESTDIR="$PWD/release/rootfs" meson install -C build
          tar czf "release/virglrenderer-${VERSION}-x86_64-linux.tar.gz" \
            -C release/rootfs .
          cd release && sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: release/

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: release/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          gh release create "$VERSION" release/* \
            --title "$VERSION" \
            --notes "Automated release. virglrenderer with nixling VA-API compatibility patch."
